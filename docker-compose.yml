services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - db-data:/app/data
      - ./config:/app/config:ro
    environment:
      DATABASE_URL: sqlite+aiosqlite:///data/trade_bot.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      API_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - path: .env
        required: false
    volumes:
      - db-data:/app/data
      - ./config:/app/config:ro
    environment:
      DATABASE_URL: sqlite+aiosqlite:///data/trade_bot.db
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
