[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-bot"
version = "0.1.0"
description = "Agentic stock market research and trading bot"
requires-python = ">=3.12"
dependencies = [
    "ib_insync>=0.9.86",
    "krakenex>=2.1.0",
    "pykrakenapi>=0.3.1",
    "anthropic>=0.42.0",
    "ollama>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "discord.py>=2.4.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "TA-Lib>=0.4.32",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "jinja2>=3.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "feedparser>=6.0.0",
    "textual>=0.89.0",
    "plotext>=5.3.0",
    "asciichartpy>=1.5.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.3.0",
]

[project.scripts]
tradebot = "src.cli.main:app"

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.0"]
ml = [
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyrefly>=0.18.0",
    "deptry>=0.21.0",
    "vulture>=2.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
]
markers = [
    "unit: Unit tests (no I/O)",
    "component: Component tests (mock boundaries)",
    "integration: Integration tests (real I/O)",
    "slow: Slow tests (ML training, Monte Carlo)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyrefly]
python_version = "3.12"
search_path = ["."]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.",
]

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "aiosqlite", "python-dotenv", "jinja2", "websockets", "textual", "krakenex", "pykrakenapi", "ollama", "pandas", "apscheduler", "pydantic-settings", "yfinance", "xgboost", "scikit-learn", "asyncpg"]

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["src/trade_bot.egg-info"]
