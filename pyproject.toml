[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-bot"
version = "0.1.0"
description = "Agentic stock market research and trading bot"
requires-python = ">=3.12"
dependencies = [
    "ib_insync>=0.9.86",
    "krakenex>=2.1.0",
    "pykrakenapi>=0.3.1",
    "anthropic>=0.42.0",
    "ollama>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "discord.py>=2.4.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "TA-Lib>=0.4.32",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
